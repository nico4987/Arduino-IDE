<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control ESP32</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="card">
        <div class="header">
            <h1>💡 Control ESP32</h1>
            <p>Gestión remota de iluminación</p>
        </div>
        <div class="status-container">
            <span id="statusText">Estado: Esperando acción...</span>
        </div>
        <div class="btn-container">
            <button id="btnOn" class="btn btn-on">Encender</button>
            <button id="btnOff" class="btn btn-off">Apagar</button>
        </div>
    </div>
    <script type="module" src="js.js"></script>
</body>
</html>
