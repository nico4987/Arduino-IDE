<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 | Smart Control</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <!-- Efectos de fondo animado -->
    <div class="bg-shape shape1"></div>
    <div class="bg-shape shape2"></div>

    <div class="glass-panel">
        <div class="header">
            <h2>⚡ Núcleo ESP32</h2>
            <p class="subtitle">Conexión Firebase Activa</p>
        </div>

        <!-- Representación visual del LED -->
        <div class="led-container">
            <div class="led-ring" id="ledRing">
                <div class="led-core" id="ledCore"></div>
            </div>
        </div>

        <div class="status-box">
            <span class="status-dot" id="statusDot"></span>
            <span id="statusText">Sistema en espera...</span>
        </div>

        <div class="controls">
            <button id="btnOn" class="neon-btn btn-green">
                <i></i> ENCENDER LED
            </button>
            <button id="btnOff" class="neon-btn btn-red">
                <i></i> APAGAR LED
            </button>
        </div>
    </div>

    <script type="module" src="js.js"></script>
</body>
</html>
